<VirtualHost *:80>
    ServerAdmin admin@t3rmx.com
    DocumentRoot /var/www/public
    ServerName t3rmx.local
    ServerAlias *.t3rmx.local

    <Directory /var/www/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/t3rmx_error.log
    CustomLog ${APACHE_LOG_DIR}/t3rmx_access.log combined
</VirtualHost>
